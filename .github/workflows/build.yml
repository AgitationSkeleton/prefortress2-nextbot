name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create/update a GitHub release with this tag (e.g. v1.0.1). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

env:
  # alliedmodders/hl2sdk branch sdk2013, pinned
  HL2SDK_REF: 4c56ee5bc8bfe00793abb7d40eb3f6fb040f10d2
  # alliedmodders/metamod-source 1.12 release tag (plugin API 16)
  MMSOURCE_TAG: 1.12.0.1228
  SOURCEMOD_BRANCH: '1.12'

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Ubuntu 22.04 (glibc 2.35) so the plugin also runs on older server distributions.
    container: ubuntu:22.04
    steps:
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends clang g++-multilib python3 git ca-certificates curl file binutils libc6:i386
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch hl2sdk and Metamod:Source
        run: |
          git init -q deps/hl2sdk
          git -C deps/hl2sdk fetch -q --depth 1 https://github.com/alliedmodders/hl2sdk.git "$HL2SDK_REF"
          git -C deps/hl2sdk checkout -q FETCH_HEAD
          git clone -q --depth 1 --branch "$MMSOURCE_TAG" https://github.com/alliedmodders/metamod-source.git deps/metamod-source
      - name: Build pf2nextbot_i486.so
        run: python3 tools/build.py
      - name: Check binary
        run: |
          f=build/pf2nextbot_i486.so
          file $f
          readelf -d $f | grep NEEDED
          echo "exports:"; nm -D --defined-only $f
          nm -D --defined-only $f | grep -q ' T CreateInterface$'
          test "$(nm -D --defined-only $f | grep -c ' T ')" = 1
          echo "highest glibc symbol version:"; objdump -T $f | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
          objcopy --strip-debug $f build/stripped.so
          mkdir -p out && cp build/stripped.so out/pf2nextbot_i486.so && cp $f out/pf2nextbot_i486.debug.so
      - name: Compile SourceMod plugin
        run: |
          name=$(curl -fsSL "https://sm.alliedmods.net/smdrop/${SOURCEMOD_BRANCH}/sourcemod-latest-linux")
          curl -fsSL "https://sm.alliedmods.net/smdrop/${SOURCEMOD_BRANCH}/${name}" -o /tmp/sm.tar.gz
          mkdir -p /tmp/sm && tar -xzf /tmp/sm.tar.gz -C /tmp/sm
          cp sourcemod/scripting/pf2_hunted_classrestrict.sp sourcemod/scripting/pf2_spawnfix.sp /tmp/sm/addons/sourcemod/scripting/
          cd /tmp/sm/addons/sourcemod/scripting
          # relative paths only, so the debug info in the .smx carries no build-machine paths
          if [ -x spcomp64 ]; then spc=./spcomp64; else spc=./spcomp; fi
          for p in pf2_hunted_classrestrict pf2_spawnfix; do
            $spc $p.sp -o$p.smx
            cp $p.smx "$GITHUB_WORKSPACE/out/"
          done
      - name: Check .smx for absolute paths
        run: |
          python3 - out/pf2_hunted_classrestrict.smx out/pf2_spawnfix.smx <<'EOF'
          import re, struct, sys, zlib
          failed = False
          for path in sys.argv[1:]:
              d = open(path, "rb").read()
              magic, ver, comp, disk, img, nsec, stab, doff = struct.unpack_from("<IHBIIBII", d, 0)
              body = d[:doff] + (zlib.decompress(d[doff:]) if comp == 1 else d[doff:])
              bad = sorted({s.decode() for s in re.findall(rb"[\x20-\x7e]{4,}", body)
                            if re.search(rb"(^|[^A-Za-z])(/home/|/tmp/|/__w/|/github/|[A-Za-z]:[\\/])", s)})
              print(path + ": " + (", ".join(bad) or "no absolute paths"))
              failed = failed or bool(bad)
          sys.exit(1 if failed else 0)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch hl2sdk and Metamod:Source
        shell: bash
        run: |
          git init -q deps/hl2sdk
          git -C deps/hl2sdk fetch -q --depth 1 https://github.com/alliedmodders/hl2sdk.git "$HL2SDK_REF"
          git -C deps/hl2sdk checkout -q FETCH_HEAD
          git clone -q --depth 1 --branch "$MMSOURCE_TAG" https://github.com/alliedmodders/metamod-source.git deps/metamod-source
      - name: Build pf2nextbot.dll (MSVC x86, /MT)
        run: python tools/build.py
      - name: Check exports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x86' | Select-Object -First 1
          $out = & $dumpbin.FullName /nologo /headers /exports build\pf2nextbot.dll
          $out | Select-String 'machine|CreateInterface'
          if (-not ($out | Select-String 'CreateInterface')) { throw 'CreateInterface not exported' }
          if (-not ($out | Select-String '14C machine')) { throw 'not an x86 DLL' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build\pf2nextbot.dll, build\pf2nextbot.pdb out\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  package:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Version
        id: v
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}";
          elif [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG";
          else tag=""; fi
          if [[ -n "$tag" ]]; then version="${tag#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          python3 tools/package.py plugin "${{ steps.v.outputs.version }}" windows --binary artifacts/windows/pf2nextbot.dll --smx artifacts/linux/pf2_hunted_classrestrict.smx --spawnfix-smx artifacts/linux/pf2_spawnfix.smx
          python3 tools/package.py plugin "${{ steps.v.outputs.version }}" linux --binary artifacts/linux/pf2nextbot_i486.so --smx artifacts/linux/pf2_hunted_classrestrict.smx --spawnfix-smx artifacts/linux/pf2_spawnfix.smx
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: dist/
          if-no-files-found: error
      - name: Publish release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          Drop-in zips for the PF2 game directory (`pf2/`). Needs Metamod:Source 1.11/1.12 on the server.
          Nav meshes for PF2's maps are a separate download (`prefortress2-nextbot-navmeshes-*.zip`, attached to the first release).
          The Linux build has not been run on a Linux PF2 server yet; see the README "Known gaps".
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
