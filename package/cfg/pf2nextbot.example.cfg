// prefortress2-nextbot: example bot settings. Copy the lines you want into cfg/server.cfg.

tf_bot_difficulty 3              // 0 easy, 1 normal, 2 hard, 3 expert
tf_bot_quota 12                  // with fill: bots fill up to 12 total players
tf_bot_quota_mode fill           // normal | fill | match
tf_bot_join_after_player 0       // 0: bots join an empty server
tf_bot_auto_vacate 1             // a bot leaves to make room for a joining human
tf_bot_keep_class_after_death 0
tf_bot_civilian_chance 10        // % chance a bot picks the Civilian (never on hunted/VIP maps)
pf2nb_prevent_hibernation 1      // keep an empty server awake so bots can fill it (Windows only)

// Manual control:
//   tf_bot_add [count] [red|blue] [class] [easy|normal|hard|expert]
//   tf_bot_kick all
//   pf2nb_status
