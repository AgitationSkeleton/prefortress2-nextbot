// pf2_hunted_classrestrict: per-map overrides (optional).
// By default the rules are derived from the map itself at map start: info_player_teamspawn class
// masks, ignoring spawns inside a damaging trigger_hurt (the cage). Only maps with caged spawns
// are restricted. Add an entry here only where that derivation is wrong.
//
//   "red" / "blue"  space separated classes (scout sniper soldier demoman medic heavyweapons pyro
//                   spy engineer civilian, or "all"); a list here also turns enforcement on for a
//                   map without cages. A team without a key keeps its derived rule.
//   "enabled" "0"   never restrict this map.
// On restricted maps the Civilian is always removed from RED and BLU may have one human Civilian.
"HuntedClassRestrict"
{
	// Stonehenge has no cages (both teams may play anything); enabled: keeps RED off the VIP
	// and cap BLU at one human Civilian there.
	"hunted_stonehenge_test"
	{
		"red"	"all"
		"blue"	"all"
	}

	// Example: switch the plugin off for one map.
	//"hunted_example"
	//{
	//	"enabled"	"0"
	//}
}
